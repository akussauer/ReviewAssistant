appId: com.mps.reviewassistant
productName: Review Assistant # what people see; the exe and settings folder stay "ReviewAssistant"
directories:
  buildResources: build
# Only what the app runs: the built code and its resources. (node_modules for the main
# process's dependencies are added by electron-builder.) Everything else, e.g. docs/
# with its sample data, stays out of the installer.
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
# Switches baked into the exe (plan M9): it can't be run as plain Node.js, NODE_OPTIONS
# and --inspect are ignored, and it only loads the app from its own app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# Windows opens .review files with the app (the app's own icon; type name below).
fileAssociations:
  - ext: review
    name: ReviewAssistant.review
    description: Review Assistant review
win:
  executableName: ReviewAssistant
  icon: resources/icon.ico # the app logo, made square from resources/Logo.png
# Assisted per-user install (plan M9): no admin prompt, the folder can be changed.
# Uninstalling keeps the settings folder; .review files are never touched.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: true
  # The installer speaks Windows' language if it's one of these (plan M10d); there's no
  # language-picker page. electron-builder brings the translations of its own pages.
  multiLanguageInstaller: true
  installerLanguages: [en_US, de_DE, fr_FR, es_ES]
  displayLanguageSelector: false
# mac/linux targets are kept but untested; Windows is the supported platform.
mac:
  icon: resources/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: Alex Kussauer
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
